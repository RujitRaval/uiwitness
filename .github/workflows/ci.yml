name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
      - name: Validate documentation
        run: node scripts/check-docs.mjs
      - name: Validate brand contract
        run: node scripts/check-brand.mjs
      - name: Test repository checks
        run: node --test scripts/*.test.mjs

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
      - name: Install dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Install Chromium
        run: corepack pnpm --filter uiwitness-runner-playwright exec playwright install --with-deps chromium
      - name: Run repository checks
        run: node scripts/run-ci.mjs

  contract-core:
    name: Contract Core (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.20.0
          - 24.19.0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Run core contract tests
        run: |
          corepack pnpm benchmark:contract
          corepack pnpm --filter uiwitness-core test

  release-smoke:
    name: Release Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
      - name: Install dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Install Chromium
        run: corepack pnpm --filter uiwitness-runner-playwright exec playwright install --with-deps chromium
      - name: Build release artifacts
        run: corepack pnpm build
      - name: Run clean-checkout consumer smoke
        id: release-smoke
        run: corepack pnpm release:smoke
      - name: Upload UIWitness evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uiwitness-release-smoke-report
          path: ${{ steps.release-smoke.outputs.artifact-path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  package-smoke:
    name: Package Smoke (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.20.0
          - 24.19.0
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Validate package metadata
        run: corepack pnpm release:check
      - name: Pack and test npm artifacts
        run: corepack pnpm release:package-smoke -- --action-sha "$GITHUB_SHA"
